name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server.mjs
      - name: UI smoke test (jsdom)
        run: node test/smoke.mjs
      - name: Worktree e2e test
        run: node test/worktree.mjs
      - name: Browser bridge protocol test
        run: node test/browser-bridge.mjs
      - name: Browser pair flow test
        run: node test/browser-pair.mjs
      - name: MCP bridge test
        run: node test/mcp-bridge.mjs
