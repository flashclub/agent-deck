<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentDeck</title>
<link rel="stylesheet" href="/vendor/normalize.css" />
<link rel="stylesheet" href="/vendor/xterm.css" />
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<style>
/* ================= 主题变量 ================= */
:root { --term-font: 15px; }
[data-theme="dark"] {
	--bg: #171a21;
	--panel: #21252e;
	--panel2: #2a2f3a;
	--line: #3a4150;
	--line-soft: #313845;
	--fg: #eef1f6;
	--fg2: #c2cad6;      /* 次级文字：保证可读 */
	--fg3: #97a1b2;
	--accent: #a48bff;
	--accent-deep: #7c5cf0;
	--accent-contrast: #ffffff;
	--green: #3ddc97;
	--red: #ff7a7a;
	--yellow: #ffcc66;
	--blue: #6fb3ff;
	--shadow: 0 10px 34px rgba(0,0,0,.45);
	--term-bg: #21252e;
}
[data-theme="light"] {
	--bg: #eceff4;
	--panel: #ffffff;
	--panel2: #f4f6fa;
	--line: #d5dbe4;
	--line-soft: #e2e7ee;
	--fg: #1d222c;
	--fg2: #3f4855;
	--fg3: #5d6774;
	--accent: #6d4bf0;
	--accent-deep: #5b3ce0;
	--accent-contrast: #ffffff;
	--green: #149e63;
	--red: #d5333f;
	--yellow: #b07b00;
	--blue: #1160c9;
	--shadow: 0 10px 30px rgba(30,40,60,.14);
	--term-bg: #ffffff;
}

/* 基线交由 modern-normalize（box-sizing/字体栈/表单继承），此处只补主题相关基线 */
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input::placeholder, textarea::placeholder { color: var(--fg3); opacity: 1; }
::selection { background: var(--accent); color: var(--accent-contrast); }
html { -webkit-tap-highlight-color: transparent; }
body { -webkit-font-smoothing: antialiased; }
html, body { height: 100%; margin: 0; }
body {
	font: 14.5px/1.5 -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
	background: var(--bg); color: var(--fg);
	overflow: hidden; display: flex; flex-direction: column;
	transition: background .25s, color .25s;
}

/* ================= 顶栏 ================= */
#topbar {
	display: flex; align-items: center; gap: 14px;
	padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
	flex: none; z-index: 5;
}
#brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
#brand .mark {
	width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
	background: linear-gradient(135deg, var(--accent-deep), var(--accent)); color: #fff; font-size: 14px;
}
#brand small { font-weight: 500; color: var(--fg3); font-size: 12.5px; }
#topbar .grow { flex: 1; }

.tbtn {
	height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px;
	border: 1px solid var(--line); color: var(--fg2); background: var(--panel2);
	font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.tbtn:hover { color: var(--fg); border-color: var(--accent); }
#fontSizeLab { min-width: 44px; text-align: center; color: var(--fg2); font-variant-numeric: tabular-nums; }

.accentWrap { position: relative; }
#accentPop {
	position: absolute; top: 40px; right: 0; z-index: 60; display: none;
	background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px;
	padding: 10px; box-shadow: var(--shadow); gap: 9px; flex-wrap: wrap; width: 152px;
}
#accentPop.open { display: flex; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; flex: none; }
.swatch:hover { transform: scale(1.12); }
.swatch.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--fg3); }

#themeSeg, #langSeg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel2); }
#themeSeg button, #langSeg button {
	height: 32px; padding: 0 14px; font-size: 13px; color: var(--fg3); display: flex; align-items: center; gap: 6px;
}
#themeSeg button.on, #langSeg button.on { background: var(--accent-deep); color: var(--accent-contrast); font-weight: 600; }

/* ================= 网格 ================= */
#grid {
	flex: 1; display: grid; min-height: 0; gap: 12px; padding: 12px;
	grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
}
#grid.maxmode .pane:not(.maxed) { display: none; }
#grid.maxmode { grid-template-columns: 1fr; grid-template-rows: 1fr; }

.pane {
	position: relative;
	display: flex; flex-direction: column; min-width: 0; min-height: 0;
	background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden;
	box-shadow: var(--shadow);
}
.pane.focused { border-color: var(--accent); }

.pane-hd {
	display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px;
	background: var(--panel2); border-bottom: 1px solid var(--line-soft); flex: none;
}
.pdot { width: 9px; height: 9px; border-radius: 50%; background: var(--fg3); flex: none; }
.pdot.run { background: var(--green); }
.pdot.active { background: var(--green); animation: pulse 1s infinite; box-shadow: 0 0 8px var(--green); }
.pdot.exited { background: var(--red); }
@keyframes pulse { 50% { opacity: .35; } }

.picon {
	width: 22px; height: 22px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line);
	display: grid; place-items: center; font-size: 12.5px; color: var(--accent); flex: none; font-weight: 700;
}
.pname { color: var(--fg3); font-size: 12px; font-weight: 500; white-space: nowrap; flex: none; }
.ptitle {
	font-weight: 700; font-size: 13.5px; cursor: text; padding: 1px 5px; border-radius: 5px;
	border: 1px dashed transparent; max-width: 34%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ptitle:hover { border-color: var(--line); background: var(--panel); }
.ptitle-input {
	font: inherit; font-weight: 700; font-size: 13.5px; color: var(--fg); background: var(--panel);
	border: 1px solid var(--accent); border-radius: 5px; padding: 1px 6px; width: 190px; outline: none;
}
.pcwd {
	color: var(--fg3); font-size: 12px; white-space: nowrap; overflow: hidden;
	max-width: 0; opacity: 0; transition: max-width .3s ease, opacity .3s ease;
}
.pane-hd:hover .pcwd { max-width: 40vw; opacity: 1; }
.pane-hd .grow { flex: 1; }
.pact {
	width: 28px; height: 26px; border-radius: 7px; color: var(--fg3); font-size: 13px;
	display: grid; place-items: center; border: 1px solid transparent;
}
.pact:hover { color: var(--fg); background: var(--panel); border-color: var(--line); }
.pact.danger:hover { color: var(--red); }

.term { flex: 1; min-height: 0; padding: 4px 6px 6px; }
.term .xterm { height: 100%; }
.term .xterm-viewport { background: var(--term-bg) !important; }

/* ================= 启动器（空窗格） ================= */
.launcher {
	position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
	align-items: center; justify-content: center; gap: 14px; padding: 18px;
	background: var(--panel); overflow-y: auto;
}
.launcher h3 { margin: 0; font-size: 14.5px; color: var(--fg2); font-weight: 600; }
.agentBtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 480px; }
.agentBtn {
	display: flex; flex-direction: column; align-items: center; gap: 6px;
	width: 104px; padding: 12px 8px 10px; border-radius: 12px;
	background: var(--panel2); border: 1.5px solid var(--line); color: var(--fg);
}
.agentBtn:hover { border-color: var(--accent); transform: translateY(-1px); }
.agentBtn .ic {
	width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; font-weight: 700;
	background: linear-gradient(135deg, var(--accent-deep), var(--accent)); color: #fff;
}
.agentBtn .nm { font-weight: 600; font-size: 13.5px; }
.agentBtn .ds { font-size: 11.5px; color: var(--fg3); }
.launcher .cwdRow { display: flex; gap: 8px; width: min(440px, 90%); }
.launcher input {
	flex: 1; padding: 9px 12px; border-radius: 9px; border: 1.5px solid var(--line);
	background: var(--panel2); color: var(--fg); font-size: 13.5px; min-width: 0;
}
.launcher input:focus { border-color: var(--accent); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 520px; }
.chip {
	padding: 4px 12px; border-radius: 99px; font-size: 12px; color: var(--fg2);
	border: 1px solid var(--line); background: var(--panel2);
}
.chip:hover { border-color: var(--accent); color: var(--fg); }
.launcher .hint { font-size: 12px; color: var(--fg3); }

/* ================= 退出遮罩 ================= */
.exited {
	position: absolute; inset: 0; z-index: 4; display: none;
	align-items: center; justify-content: center; gap: 12px; flex-direction: column;
	background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(2px);
}
.exited.show { display: flex; }
.exited .code { color: var(--fg2); font-size: 13.5px; }
.exited .row { display: flex; gap: 10px; }
.bigBtn { padding: 9px 22px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.bigBtn.primary { background: linear-gradient(135deg, var(--accent-deep), var(--accent)); color: #fff; }
.bigBtn.ghost { border: 1.5px solid var(--line); color: var(--fg2); background: var(--panel2); }
.bigBtn:hover { filter: brightness(1.08); }

/* ================= 对话框（替代原生 alert/confirm） ================= */
.dlg-mask {
	position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
	background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(4px);
	animation: dlgFade .15s ease;
}
@keyframes dlgFade { from { opacity: 0; } }
@keyframes dlgPop { from { opacity: 0; transform: scale(.94) translateY(6px); } }
.dlg {
	width: min(400px, 90vw); background: var(--panel); border: 1.5px solid var(--line);
	border-radius: 16px; padding: 22px; box-shadow: var(--shadow); animation: dlgPop .18s cubic-bezier(.2,.9,.3,1.2);
}
.dlg h4 { margin: 0 0 8px; font-size: 15.5px; }
.dlg p { margin: 0 0 20px; color: var(--fg2); font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
.dlg .row { display: flex; justify-content: flex-end; gap: 10px; }
.bigBtn.danger { background: var(--red); color: #fff; }

/* ================= 断线提示 ================= */
#connBanner {
	position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 50;
	background: var(--red); color: #fff; padding: 8px 20px; border-radius: 99px;
	font-size: 13.5px; font-weight: 600; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.3);
}

/* ================= 底部广播输入条 ================= */
#casterIcon {
	position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
	width: 46px; height: 46px; border-radius: 50%; z-index: 40;
	background: var(--panel); border: 1.5px solid var(--line); color: var(--fg2);
	font-size: 19px; box-shadow: var(--shadow); opacity: .55;
	transition: opacity .2s, transform .2s, border-color .2s, color .2s;
}
#casterIcon:hover { opacity: 1; border-color: var(--accent); color: var(--accent); transform: translateX(-50%) scale(1.07); }

#caster {
	position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 41;
	display: none; flex-direction: column; align-items: center; gap: 7px;
}
#caster.open { display: flex; animation: castUp .18s ease; }
@keyframes castUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
#casterBar {
	display: flex; align-items: center; gap: 8px; padding: 8px 10px;
	width: min(840px, 94vw); border-radius: 16px;
	background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(12px);
	border: 1.5px solid var(--line); box-shadow: var(--shadow);
}
#casterTargets { display: flex; gap: 6px; flex: none; max-width: 58%; overflow-x: auto; padding-bottom: 1px; }
.ctarget {
	display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 9px;
	border: 1.5px solid var(--line); background: var(--panel2); color: var(--fg2);
	font-size: 12.5px; white-space: nowrap; flex: none;
}
.ctarget:hover { color: var(--fg); border-color: var(--accent); }
.ctarget.sel { background: var(--accent-deep); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
.ctarget .n { font-size: 10.5px; opacity: .7; }
#casterInput { flex: 1; min-width: 100px; border: none; background: none; font-size: 14.5px; color: var(--fg); padding: 6px 4px; }
#casterInput:focus { outline: none; }
#casterSend {
	padding: 7px 16px; border-radius: 10px; flex: none; font-weight: 600; font-size: 13px;
	background: linear-gradient(135deg, var(--accent-deep), var(--accent)); color: var(--accent-contrast);
}
#casterSend:hover { filter: brightness(1.1); }
#casterHint {
	font-size: 11.5px; color: var(--fg3); padding: 3px 14px; border-radius: 99px;
	background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(8px);
}
#casterHint b { color: var(--fg2); font-weight: 600; }

.pane.cast-flash { animation: castGlow .9s ease; }
@keyframes castGlow {
	0%, 55% { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent), var(--shadow); }
}

body.bar-collapsed #topbar { display: none; }
body.bar-collapsed #grid { padding-top: 52px; } /* 给悬浮按钮留出专属条，不再叠在窗格上 */
#barShow {
	position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 39; display: none;
	height: 32px; padding: 0 16px 0 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--fg2);
	background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(10px);
	border: 1px solid var(--line); box-shadow: var(--shadow);
	align-items: center; justify-content: center; gap: 6px;
}
#barShow:hover { color: var(--fg); border-color: var(--accent); }
#barShow svg { display: block; }
body.bar-collapsed #barShow { display: inline-flex; }

@media (max-width: 900px) {
	#grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); }
}
</style>
</head>
<body data-theme="dark">

<div id="connBanner">⚠ 与服务器断开，正在重连…</div>
<datalist id="recentsList"></datalist>

<div id="topbar">
	<div id="brand"><span class="mark">⬡</span>AgentDeck<small>4 agents · 2×2</small></div>
	<div class="grow"></div>
	<button class="tbtn" id="fontMinus" title="减小终端字号">A −</button>
	<span id="fontSizeLab">15px</span>
	<button class="tbtn" id="fontPlus" title="增大终端字号">A ＋</button>
	<div class="accentWrap">
		<button class="tbtn" id="accentBtn" title="Accent">◈</button>
		<div id="accentPop"></div>
	</div>
	<div id="themeSeg">
		<button id="thDark">🌙 深色</button>
		<button id="thLight">☀️ 浅色</button>
	</div>
	<div id="langSeg">
		<button id="langZh">中</button>
		<button id="langEn">EN</button>
	</div>
	<button class="tbtn" id="barCollapse">收起 ▾</button>
</div>

<button id="barShow">
	<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
	<span id="barShowText"></span>
</button>

<div id="grid"></div>

<button id="casterIcon" title="给终端发消息（悬停展开）">⌨</button>
<div id="caster">
	<div id="casterBar">
		<div id="casterTargets"></div>
		<input id="casterInput" maxlength="4000" placeholder="输入消息，Enter 发送到选中终端…" spellcheck="false" />
		<button id="casterSend">发送 ▶</button>
	</div>
	<div id="casterHint"><b>Tab</b> 切换目标 · <b>⌘/Ctrl+⏎</b> 广播全部 · <b>Esc</b> 收起</div>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const { Terminal } = window.Terminal !== undefined ? { Terminal: window.Terminal } : {};
const FitAddon = window.FitAddon ? window.FitAddon.FitAddon : undefined;

/* ================= 主题（xterm 调色板 + CSS 变量联动） ================= */
const TERM_THEMES = {
	dark: {
		background: "#21252e", foreground: "#eef1f6", cursor: "#a48bff", cursorAccent: "#21252e",
		selectionBackground: "#44506a",
		black: "#454c59", red: "#ff7a7a", green: "#3ddc97", yellow: "#ffcc66",
		blue: "#6fb3ff", magenta: "#d99bff", cyan: "#5fd4e0", white: "#d7dde8",
		brightBlack: "#8b95a7", brightRed: "#ff9e9e", brightGreen: "#6ef0b4", brightYellow: "#ffe08a",
		brightBlue: "#93c6ff", brightMagenta: "#ecb8ff", brightCyan: "#8ae6f0", brightWhite: "#ffffff",
	},
	light: {
		background: "#ffffff", foreground: "#1d222c", cursor: "#6d4bf0", cursorAccent: "#ffffff",
		selectionBackground: "#cdd9ff",
		black: "#1d222c", red: "#cf2a36", green: "#0f8a55", yellow: "#9a6b00",
		blue: "#0b5cc4", magenta: "#7a3ff0", cyan: "#0d7d8a", white: "#5d6774",
		brightBlack: "#4a5261", brightRed: "#b32430", brightGreen: "#0c7444", brightYellow: "#7f5600",
		brightBlue: "#0a4fa3", brightMagenta: "#6829e0", cyan: "#0a6c78", brightWhite: "#3f4855",
	},
};
/* 强调色盘：[亮色系基色, 深色] × [深/浅主题]，终端光标同步 */
const ACCENTS = {
	violet: { dark: ["#a48bff", "#7c5cf0"], light: ["#6d4bf0", "#5b3ce0"] },
	blue:   { dark: ["#5ea2ff", "#2f7cf6"], light: ["#1663d6", "#0d55c0"] },
	teal:   { dark: ["#2dd4bf", "#0d9488"], light: ["#0c8577", "#0a6d63"] },
	amber:  { dark: ["#ffab5e", "#f07c1d"], light: ["#d96a00", "#b35600"] },
	rose:   { dark: ["#fb7ba2", "#e11d63"], light: ["#d6336c", "#b62a5c"] },
	slate:  { dark: ["#9db0cc", "#64748b"], light: ["#475569", "#334155"] },
};
let accent = localStorage.getItem("ag:accent") || "blue";
let themeName = localStorage.getItem("ag:theme") || "dark";
let fontSize = Number(localStorage.getItem("ag:font") || 15);
if (fontSize < 12 || fontSize > 24) fontSize = 15;

function currentTermTheme() {
	return { ...TERM_THEMES[themeName], cursor: (ACCENTS[accent] || ACCENTS.blue)[themeName][0] };
}
function applyAccent() {
	const a = (ACCENTS[accent] || ACCENTS.blue)[themeName];
	/* 必须设在 body 上：主题变量定义在 [data-theme](body)，设在 html 会被级联盖住 */
	document.body.style.setProperty("--accent", a[0]);
	document.body.style.setProperty("--accent-deep", a[1]);
	for (const t of Object.values(terms)) if (t) t.options.theme = currentTermTheme();
	renderAccentPop();
}
function applyTheme() {
	document.body.dataset.theme = themeName;
	$("#thDark").classList.toggle("on", themeName === "dark");
	$("#thLight").classList.toggle("on", themeName === "light");
	applyAccent();
}
function applyFontSize() {
	$("#fontSizeLab").textContent = fontSize + "px";
	for (const t of Object.values(terms)) if (t) t.options.fontSize = fontSize;
	fitAll();
}
$("#thDark").onclick = () => { themeName = "dark"; localStorage.setItem("ag:theme", themeName); applyTheme(); };
$("#thLight").onclick = () => { themeName = "light"; localStorage.setItem("ag:theme", themeName); applyTheme(); };
$("#fontMinus").onclick = () => { if (fontSize > 12) { fontSize--; localStorage.setItem("ag:font", fontSize); applyFontSize(); } };
$("#fontPlus").onclick = () => { if (fontSize < 24) { fontSize++; localStorage.setItem("ag:font", fontSize); applyFontSize(); } };

/* ================= i18n ================= */
const I18N = {
	zh: {
		dark: "🌙 深色", light: "☀️ 浅色", fontMinusTitle: "减小终端字号", fontPlusTitle: "增大终端字号", collapseBar: "收起 ▾", expandBar: "展开顶栏",
		casterTitle: "给终端发消息（悬停展开）", send: "发送 ▶", hintTab: "切换目标", hintBc: "广播全部", hintEsc: "收起",
		connLost: "⚠ 与服务器断开，正在重连…", pickAgent: "选择要在本窗格运行的智能体", cwdPh: "工作目录（默认上次使用）",
		go: "启动 ▶", launcherHint: "点击智能体后 Enter 启动 · 智能体和终端 TUI 快捷键与本地一致", noAgents: "未检测到可用智能体",
		reBtn: "↻ 重新启动", clearBtn: "关闭本窗格", procName: "进程", maxT: "放大/还原", restartT: "重新启动", closeT: "关闭",
		exited: (n, c) => `${n} 已退出${c != null ? `（code ${c}）` : ""}`,
		paneBusy: "该窗格正在运行，请先关闭", noAgentAvail: "没有可用智能体", noRunning: "没有运行中的终端",
		targetStopped: "目标终端已停止",
		sentTo: (l) => `已发送 → ${l}`,

		all: "◎ 全部", allTitle: "广播到全部运行中的终端", oneTitle: (n) => `发送到第 ${n} 格`,

		send: "Send ▶", hintTab: "cycle target", hintBc: "broadcast all", hintEsc: "collapse", connLost: "⚠ Disconnected, reconnecting…",
		pickAgent: "Pick an agent for this pane",

		go: "Launch ▶", launcherHint: "Click an agent then Enter to launch · Agent TUI shortcuts work as local", noAgents: "No agents detected",
		reBtn: "↻ Restart", clearBtn: "Close pane", procName: "Process", maxT: "Maximize/restore", restartT: "Restart", closeT: "Close",
		exited: (n, c) => `${n} exited${c != null ? ` (code ${c})` : ""}`,
		paneBusy: "This pane is busy — close it first", noAgentAvail: "No agent available", noRunning: "No running terminals",
		targetStopped: "Target terminal has stopped",

let lang = localStorage.getItem("ag:lang") || "en";
const T = () => I18N[lang] || I18N.zh;

/* ================= 窗格状态 ================= */
const SLOTS = 4;
const grid = $("#grid");
const paneEls = [];     // slot -> {root, hd, term, launcher, exited}
const terms = [];       // slot -> Terminal
const fits = [];        // slot -> FitAddon
const slotPane = [];    // slot -> paneId
const paneSlot = new Map(); // paneId -> slot
const paneMeta = new Map(); // paneId -> meta
let agents = [];
let recents = [];
let pendingSpawn = []; // 记录用户点击启动的格位，回包时优先绑回原格
const lastOut = new Map(); // paneId -> ts
const paneMouse = new Map(); // paneId -> { mouse, sgr }：嗅探应用是否开启鼠标上报/SGR 格式

for (let i = 0; i < SLOTS; i++) {
	const root = document.createElement("div");
	root.className = "pane";
	root.innerHTML = `
		<div class="pane-hd" style="display:none">
			<span class="pdot"></span><span class="picon"></span>
			<span class="ptitle" tabindex="0"></span><span class="pname"></span><span class="pcwd"></span><div class="grow"></div>
			<button class="pact max">⤢</button>
			<button class="pact restart">↻</button>
			<button class="pact danger close">✕</button>
		</div>
		<div class="term"></div>
		<div class="launcher">
			<h3></h3>
			<div class="agentBtns"></div>
			<div class="cwdRow">
				<input class="cwdInput" list="recentsList" spellcheck="false" />
				<button class="bigBtn primary goBtn"></button>
			</div>
			<div class="chips"></div>
			<div class="hint"></div>
		</div>
		<div class="exited">
			<div class="code"></div>
			<div class="row">
				<button class="bigBtn primary reBtn"></button>
				<button class="bigBtn ghost clearBtn"></button>
			</div>
		</div>`;
	grid.append(root);
	/* 自动生成元素引用：选择器 → 属性名 */
	const REF_MAP = { hd: ".pane-hd", dot: ".pdot", icon: ".picon", name: ".pname", ptitle: ".ptitle", cwd: ".pcwd", termBox: ".term", launcher: ".launcher", agentBtns: ".agentBtns", cwdInput: ".cwdInput", goBtn: ".goBtn", chips: ".chips", exited: ".exited", exitedCode: ".exited .code", lh3: ".launcher h3", lhint: ".launcher .hint", reBtn: ".reBtn", clearBtn: ".clearBtn", maxBtn: ".pact.max", restartBtn: ".pact.restart", closeBtn: ".pact.close" };
	const el = { root };
	for (const [k, sel] of Object.entries(REF_MAP)) el[k] = root.querySelector(sel);
	paneEls.push(el);

	// 交互
	root.addEventListener("mousedown", (e) => {
		if (e.target.closest("input")) return; // 输入框交互不抢焦点
		/* 点在终端区之外（头部/留白）时阻止默认行为，否则浏览器会把焦点移到 body，
		   掩掉我们刚设置的终端焦点，导致 Esc/键盘输入丢失 */
		if (!e.target.closest(".term")) e.preventDefault();
		focusSlot(i);
	}, true);
	el.ptitle.onclick = () => editTitle(i);
	el.maxBtn.onclick = (e) => { e.stopPropagation(); toggleMax(i); };
	el.restartBtn.onclick = (e) => { e.stopPropagation(); restartSlot(i); };
	el.closeBtn.onclick = (e) => { e.stopPropagation(); closeSlot(i); };
	el.reBtn.onclick = () => restartSlot(i);
	el.clearBtn.onclick = () => { clearSlot(i); };
	el.goBtn.onclick = () => launchFrom(i);
	el.cwdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") launchFrom(i); });

	// 终端
	const term = new Terminal({
		fontSize,
		fontFamily: '"SF Mono", Menlo, "Cascadia Code", "JetBrains Mono", Consolas, monospace',
		theme: currentTermTheme(),
		cursorBlink: true,
		allowProposedApi: true,
		scrollback: 4000,
	});
	const fit = new FitAddon();
	term.loadAddon(fit);
	term.open(el.termBox);
	terms[i] = term;
	fits[i] = fit;
	term.onData((data) => {
		const pid = slotPane[i];
		if (pid) send({ t: "input", id: pid, data });
	});
	term.onResize(({ cols, rows }) => {
		const pid = slotPane[i];
		if (pid) send({ t: "resize", id: pid, cols, rows });
	});
	// 滚轮补丁：xterm.js 在备用屏下不转发滚轮鼠标事件（getLinesScrolled===0 即丢弃），
	// 自绘 TUI（pi/htop）依赖滚轮事件滚动，这里手动转发 SGR 序列；无鼠标上报时退化为箭头滚动
	el.termBox.addEventListener("wheel", (e) => {
		const pid = slotPane[i];
		if (!pid) return;
		const term = terms[i];
		if (!term.buffer || term.buffer.active.type !== "alternate") return; // 正常缓冲区交给 xterm 原生滚动
		e.preventDefault();
		const st = paneMouse.get(pid) || {};
		const lines = Math.min(6, Math.max(1, Math.round(Math.abs(e.deltaY) / 53)));
		if (st.mouse && st.sgr) {
			const rect = el.termBox.getBoundingClientRect();
			const col = Math.min(term.cols, Math.max(1, Math.floor((e.clientX - rect.left) / rect.width * term.cols) + 1));
			const row = Math.min(term.rows, Math.max(1, Math.floor((e.clientY - rect.top) / rect.height * term.rows) + 1));
			const btn = e.deltaY < 0 ? 64 : 65;
			send({ t: "input", id: pid, data: `\x1b[<${btn};${col};${row}M`.repeat(lines) });
		} else {
			send({ t: "input", id: pid, data: (e.deltaY < 0 ? "\x1b[A" : "\x1b[B").repeat(lines) });
		}
	}, { passive: false });

	// 尺寸自适应
	new ResizeObserver(() => {
		try { fit.fit(); } catch {}
	}).observe(el.termBox);

	// 空窗格默认显示启动器
	showLauncher(i, true);
}

/* ================= 窗格 UI 状态 ================= */
function showLauncher(slot, show) {
	paneEls[slot].launcher.style.display = show ? "flex" : "none";
	paneEls[slot].hd.style.display = show ? "none" : "flex";
	if (show) { paneEls[slot].exited.classList.remove("show"); renderAgentBtns(slot); }
}
function renderAgentBtns(slot) {
	const el = paneEls[slot];
	el.agentBtns.innerHTML = "";
	for (const a of agents) {
		const b = document.createElement("button");
		b.className = "agentBtn";
		b.innerHTML = `<span class="ic">${a.icon}</span><span class="nm">${esc(a.name)}</span><span class="ds">${esc(a.desc || "")}</span>`;
		b.onclick = () => { el.cwdInput.value = el.cwdInput.value || lastCwdGuess(); launch(slot, a.id, el.cwdInput.value); };
		el.agentBtns.append(b);
	}
	if (!agents.length) el.agentBtns.innerHTML = `<div style="color:var(--fg3)">${T().noAgents}</div>`;
	// datalist + chips
	$("#recentsList").innerHTML = recents.map((d) => `<option value="${esc(d)}">`).join("");
	el.chips.innerHTML = "";
	for (const d of recents.slice(0, 6)) {
		const c = document.createElement("button");
		c.className = "chip";
		c.textContent = "~/…" + d.split("/").slice(-2).join("/");
		c.title = d;
		c.onclick = () => { el.cwdInput.value = d; el.cwdInput.focus(); };
		el.chips.append(c);
	}
}
function lastCwdGuess() { return recents[0] || ""; }
function launchFrom(slot) {
	const el = paneEls[slot];
	const first = agents[0];
	if (!first) return toast(T().noAgentAvail);
	launch(slot, first.id, el.cwdInput.value);
}
function launch(slot, agentId, cwd) {
	if (slotPane[slot]) return toast(T().paneBusy, true);
	if (!pendingSpawn.includes(slot)) pendingSpawn.push(slot);
	send({ t: "spawn", agentId, cwd: cwd || undefined, slot });
}
function syncPaneHeader(slot) {
	const pid = slotPane[slot];
	if (!pid) return;
	const meta = paneMeta.get(pid);
	if (!meta) return;
	const el = paneEls[slot];
	el.icon.textContent = meta.icon;
	el.name.textContent = meta.name;
	if (!document.activeElement?.classList.contains("ptitle-input")) el.ptitle.textContent = meta.title;
	el.cwd.textContent = meta.cwd;
	el.cwd.title = meta.cwd;
}

/** 点击标题内联编辑，Enter/失焦保存，Esc 取消 */
function editTitle(slot) {
	const pid = slotPane[slot];
	if (!pid) return;
	const meta = paneMeta.get(pid);
	const cur = meta ? meta.title : "";
	const el = paneEls[slot];
	const input = document.createElement("input");
	input.className = "ptitle-input";
	input.value = cur;
	input.maxLength = 60;
	el.ptitle.replaceWith(input);
	input.focus();
	input.select();
	let settled = false;
	const commit = (save) => {
		if (settled) return;
		settled = true;
		const v = input.value.replace(/\s+/g, " ").trim();
		input.replaceWith(el.ptitle);
		if (save && v && v !== cur) {
			el.ptitle.textContent = v;
			if (meta) meta.title = v; // 乐观更新，服务端广播会确认
			send({ t: "setTitle", id: pid, title: v });
		} else {
			el.ptitle.textContent = cur;
		}
	};
	input.addEventListener("keydown", (e) => {
		e.stopPropagation();
		if (e.key === "Enter") { e.preventDefault(); commit(true); }
		else if (e.key === "Escape") commit(false);
	});
	input.addEventListener("blur", () => commit(true));
}

function attachPane(pane, slot) {
	slotPane[slot] = pane.id;
	paneSlot.set(pane.id, slot);
	const el = paneEls[slot];
	syncPaneHeader(slot);
	showLauncher(slot, false);
	el.exited.classList.remove("show");
	setDot(slot, "run");
	const term = terms[slot];
	term.reset();
	send({ t: "replay", id: pane.id });
	setTimeout(() => { try { paneEls[slot] && fitSlot(slot); } catch {} }, 60);
	focusSlot(slot);
}
function setDot(slot, cls) {
	paneEls[slot].dot.className = "pdot" + (cls ? " " + cls : "");
}
function detachSlot(slot) {
	const pid = slotPane[slot];
	if (pid) { paneSlot.delete(pid); }
	slotPane[slot] = null;
	showLauncher(slot, true);
	setDot(slot, "");
}
function clearSlot(slot) {
	const pid = slotPane[slot];
	if (pid) send({ t: "kill", id: pid });
	detachSlot(slot);
}
async function closeSlot(slot) {
	const pid = slotPane[slot];
	if (!pid) return;
	const meta = paneMeta.get(pid);
	if (!meta) return;
	if (meta.running) {
		const ok = await confirmDialog({
			title: T().closeTitle(meta.name),
			message: T().killMsg(meta.cwd),
			confirmText: T().killBtn, danger: true,
		});
		if (!ok) return;
		send({ t: "kill", id: pid });
	}
	detachSlot(slot);
}
async function restartSlot(slot) {
	const pid = slotPane[slot];
	if (!pid) return;
	const meta = paneMeta.get(pid);
	if (!meta) return;
	if (meta.running) {
		const ok = await confirmDialog({
			title: T().restartTitle(meta.name),
			message: T().restartMsg(meta.cwd),
			confirmText: T().restartBtn, danger: true,
		});
		if (!ok) return;
	}
	const { agentId, cwd } = meta;
	send({ t: "kill", id: pid });
	detachSlot(slot);
	if (!pendingSpawn.includes(slot)) pendingSpawn.push(slot);
	send({ t: "spawn", agentId, cwd, slot });
}

/* 放大 */
let maxedSlot = -1;
function toggleMax(slot) {
	if (maxedSlot === slot) {
		maxedSlot = -1;
		grid.classList.remove("maxmode");
		paneEls[slot].root.classList.remove("maxed");
	} else {
		if (maxedSlot >= 0) { paneEls[maxedSlot].root.classList.remove("maxed"); }
		maxedSlot = slot;
		grid.classList.add("maxmode");
		paneEls[slot].root.classList.add("maxed");
	}
	setTimeout(fitAll, 50);
}

/* 焦点 */
let focusedSlot = -1;
function focusSlot(slot) {
	for (let i = 0; i < SLOTS; i++) paneEls[i].root.classList.toggle("focused", i === slot && !!slotPane[i]);
	focusedSlot = slot;
	if (slotPane[slot]) terms[slot].focus();
}
document.addEventListener("keydown", (e) => {
	if (e.altKey && !e.ctrlKey && !e.metaKey && /^[1-4]$/.test(e.key)) {
		e.preventDefault();
		focusSlot(Number(e.key) - 1);
	}
});

/* ================= reconcile：把服务端窗格分配到界面槽位 ================= */
function reconcile() {
	// 清掉已不存在的
	for (let i = 0; i < SLOTS; i++) {
		const pid = slotPane[i];
		if (pid && !paneMeta.has(pid)) detachSlot(i);
	}
	const list = [...paneMeta.values()].sort((a, b) => a.startedAt - b.startedAt);
	for (const pane of list) {
		if (paneSlot.has(pane.id)) continue;
		// 优先回服务端记录的原格位，其次用户点击的格位，最后第一个空格
		let slot;
		if (Number.isInteger(pane.slot) && pane.slot >= 0 && pane.slot < SLOTS && !slotPane[pane.slot]) {
			slot = pane.slot;
		} else {
			const pend = pendingSpawn.find((s) => !slotPane[s]);
			slot = pend !== undefined ? pend : [0, 1, 2, 3].find((i) => !slotPane[i]);
		}
		if (slot === undefined) break;
		attachPane(pane, slot);
		pendingSpawn = pendingSpawn.filter((s) => s !== slot);
	}
	renderCasterTargets();
	updateTitle();
}
function updateTitle() {
	const n = [...paneMeta.values()].filter((p) => p.running).length;
	document.title = (n ? `● ${n} ${T().running} · ` : "") + "AgentDeck";
}

/* 活动指示灯：2 秒内有输出 = 闪烁 */
setInterval(() => {
	for (let i = 0; i < SLOTS; i++) {
		const pid = slotPane[i];
		if (!pid) { setDot(i, ""); continue; }
		const meta = paneMeta.get(pid);
		if (!meta) continue;
		if (!meta.running) { setDot(i, "exited"); continue; }
		const ts = lastOut.get(pid) || 0;
		setDot(i, Date.now() - ts < 2000 ? "active" : "run");
	}
}, 800);

/* ================= WebSocket ================= */
let ws = null, wsTimer = null;
function connect() {
	ws = new WebSocket(`ws://${location.host}/ws`);
	ws.onopen = () => {
		$("#connBanner").style.display = "none";
		send({ t: "hello" });
	};
	ws.onclose = () => {
		$("#connBanner").style.display = "block";
		wsTimer = setTimeout(connect, 2000);
	};
	ws.onmessage = (e) => {
		let m; try { m = JSON.parse(e.data); } catch { return; }
		switch (m.t) {
			case "hello":
				agents = m.agents || [];
				paneMeta.clear();
				for (const p of m.panes || []) paneMeta.set(p.id, p);
				paneSlot.clear();
				slotPane.fill(null);
				for (let i = 0; i < SLOTS; i++) detachSlot(i); // 重置为启动器状态
				reconcile();
				updateTitle();
				break;
			case "recents":
				recents = m.recents || [];
				for (let i = 0; i < SLOTS; i++) if (!slotPane[i]) renderAgentBtns(i);
				break;
			case "panes": {
				paneMeta.clear();
				for (const p of m.panes || []) paneMeta.set(p.id, p);
				reconcile();
				for (let i = 0; i < SLOTS; i++) syncPaneHeader(i);
				updateTitle();
				break;
			}
			case "output": {
				lastOut.set(m.id, Date.now());
				/* 嗅探鼠标模式（模式串可能跨包分裂，启动序列通常整包到达，容忍边缘情况） */
				const st = paneMouse.get(m.id) || { mouse: false, sgr: false };
				if (/\x1b\[\?(1000|1002|1003)h/.test(m.data)) st.mouse = true;
				if (/\x1b\[\?(1000|1002|1003)l/.test(m.data)) st.mouse = false;
				if (m.data.includes("\x1b[?1006h")) st.sgr = true;
				if (m.data.includes("\x1b[?1006l")) st.sgr = false;
				paneMouse.set(m.id, st);
				const slot = paneSlot.get(m.id);
				if (slot !== undefined) terms[slot].write(m.data);
				break;
			}
			case "exit": {
				const slot = paneSlot.get(m.id);
				if (slot !== undefined) {
					const meta = paneMeta.get(m.id);
					paneEls[slot].exitedCode.textContent = T().exited(meta ? meta.name : T().procName, m.code);
					paneEls[slot].exited.classList.add("show");
				}
				break;
			}
			case "error":
				pendingSpawn.shift(); // 启动失败时释放占位的格（FIFO）
				toast(m.message, true);
				break;
		}
	};
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
connect();

/* ================= 工具 ================= */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function toast(msg, isErr) {
	let el = document.createElement("div");
	el.style.cssText = `position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;
		background:${isErr ? "var(--red)" : "var(--panel2)"};color:${isErr ? "#fff" : "var(--fg)"};
		border:1px solid var(--line);padding:9px 20px;border-radius:99px;font-size:13.5px;box-shadow:var(--shadow)`;
	el.textContent = msg;
	document.body.append(el);
	setTimeout(() => el.remove(), 3200);
}
let _dlg = null;
/** 自绘确认框：await confirmDialog({...}) → true/false。Enter 确认 / Esc 取消 / 点遮罩取消 */
function confirmDialog({ title, message = "", confirmText = T().ok, cancelText = T().cancel, danger = false }) {
	if (_dlg) _dlg.remove(); // 同一时刻只保留一个
	return new Promise((resolve) => {
		const mask = document.createElement("div");
		mask.className = "dlg-mask";
		mask.innerHTML = `
			<div class="dlg" role="dialog" aria-modal="true">
				<h4>${esc(title)}</h4>
				${message ? `<p>${esc(message)}</p>` : ""}
				<div class="row">
				<button class="bigBtn ghost cancel">${esc(cancelText)}</button>
				<button class="bigBtn ${danger ? "danger" : "primary"} ok" autofocus>${esc(confirmText)}</button>
			</div>
			</div>`;
		const done = (v) => { mask.remove(); _dlg = null; document.removeEventListener("keydown", onKey); resolve(v); };
		const onKey = (e) => {
			if (e.key === "Enter") { e.preventDefault(); done(true); }
			else if (e.key === "Escape") done(false);
		};
		mask.addEventListener("mousedown", (e) => { if (e.target === mask) done(false); });
		mask.querySelector(".cancel").onclick = () => done(false);
		mask.querySelector(".ok").onclick = () => done(true);
		document.addEventListener("keydown", onKey);
		document.body.append(mask);
		mask.querySelector(".ok").focus();
		_dlg = mask;
	});
}

function fitSlot(slot) {
	try { fits[slot] && fits[slot].fit(); } catch {}
}
function fitAll() {
	for (let i = 0; i < SLOTS; i++) fitSlot(i);
}
window.addEventListener("resize", fitAll);

/* ================= 底部广播输入条 ================= */
const caster = $("#caster"), casterIcon = $("#casterIcon"), casterInput = $("#casterInput"),
	casterTargets = $("#casterTargets"), casterSend = $("#casterSend");
let casterTarget = localStorage.getItem("ag:cast") || "all"; // "all" | 格位序号
let casterTimer = null;

function casterTargetList() {
	const list = [{ id: "all", label: T().all }];
	for (let i = 0; i < SLOTS; i++) {
		const pid = slotPane[i];
		if (!pid) continue;
		const meta = paneMeta.get(pid);
		if (!meta || !meta.running) continue;
		list.push({ id: String(i), label: `${meta.icon} ${meta.name}`, num: i + 1 });
	}
	return list;
}

function renderCasterTargets() {
	const list = casterTargetList();
	if (!list.some((t) => String(t.id) === String(casterTarget))) casterTarget = "all";
	casterTargets.innerHTML = "";
	for (const t of list) {
		const b = document.createElement("button");
		b.className = "ctarget" + (String(casterTarget) === t.id ? " sel" : "");
		b.innerHTML = t.num != null ? `<span class="n">${t.num}</span>${esc(t.label)}` : esc(t.label);
		b.title = t.id === "all" ? T().allTitle : T().oneTitle(t.num);
		b.onclick = () => { casterTarget = t.id; localStorage.setItem("ag:cast", t.id); renderCasterTargets(); casterInput.focus(); };
		casterTargets.append(b);
	}
	casterInput.placeholder = casterTarget === "all"
		? T().phAll
		: T().phOne(Number(casterTarget) + 1);
}

function openCaster(focus = true) {
	caster.classList.add("open");
	casterIcon.style.display = "none";
	renderCasterTargets();
	if (focus) casterInput.focus();
}
function closeCaster(refocusTerm = true) {
	caster.classList.remove("open");
	casterIcon.style.display = "";
	casterInput.blur();
	if (refocusTerm && focusedSlot >= 0 && slotPane[focusedSlot]) terms[focusedSlot].focus();
}

casterIcon.addEventListener("mouseenter", () => { clearTimeout(casterTimer); openCaster(false); }); // 悬停只展开，不抢焦点
casterIcon.addEventListener("click", () => openCaster(true)); // 点击展开并聚焦
caster.addEventListener("mouseenter", () => clearTimeout(casterTimer));
caster.addEventListener("mouseleave", () => {
	casterTimer = setTimeout(() => { if (document.activeElement !== casterInput) closeCaster(false); }, 400);
});
casterInput.addEventListener("focus", () => clearTimeout(casterTimer));
casterInput.addEventListener("blur", () => {
	casterTimer = setTimeout(() => { if (!caster.matches(":hover")) closeCaster(false); }, 350);
});
casterInput.addEventListener("keydown", (e) => {
	if (e.key === "Tab") {
		e.preventDefault();
		const list = casterTargetList();
		if (list.length < 2) return;
		const idx = list.findIndex((t) => String(t.id) === String(casterTarget));
		const next = e.shiftKey ? list[(idx - 1 + list.length) % list.length] : list[(idx + 1) % list.length];
		casterTarget = next.id;
		localStorage.setItem("ag:cast", next.id);
		renderCasterTargets();
	} else if (e.key === "Enter" && !e.isComposing) {
		e.preventDefault();
		castSend(e.metaKey || e.ctrlKey);
	} else if (e.key === "Escape") {
		closeCaster();
	}
});
casterSend.onclick = () => castSend(false);

function castSend(forceAll) {
	const text = casterInput.value.replace(/[\r\n\t]+/g, " ").trim();
	if (!text) return;
	const list = casterTargetList();
	let targets;
	if (forceAll || casterTarget === "all") {
		targets = list.filter((t) => t.id !== "all");
		if (!targets.length) return toast(T().noRunning, true);
	} else {
		const t = list.find((x) => x.id === casterTarget);
		if (!t) return toast(T().targetStopped, true);
		targets = [t];
	}
	for (const t of targets) {
		const slot = Number(t.id);
		const pid = slotPane[slot];
		if (!pid) continue;
		send({ t: "input", id: pid, data: text + "\r" });
		flashPane(slot);
	}
	casterInput.value = "";
	toast(T().sentTo(targets.map((t) => (t.num != null ? `${t.num}·${t.label}` : T().all)).join(" · ")));
}
function flashPane(slot) {
	const root = paneEls[slot].root;
	root.classList.remove("cast-flash");
	void root.offsetWidth; // 重启动画
	root.classList.add("cast-flash");
	setTimeout(() => root.classList.remove("cast-flash"), 950);
}
/* 窗格变化时同步刷新指挥条目标列表（reconcile 尾部也会调用） */

function renderAccentPop() {
	const pop = $("#accentPop");
	pop.innerHTML = "";
	for (const [key, v] of Object.entries(ACCENTS)) {
		const b = document.createElement("button");
		b.className = "swatch" + (key === accent ? " on" : "");
		b.style.background = `linear-gradient(135deg, ${v[themeName][0]}, ${v[themeName][1]})`;
		b.title = key;
		b.onclick = () => { accent = key; localStorage.setItem("ag:accent", key); applyAccent(); };
		pop.append(b);
	}
}
$("#accentBtn").onclick = (e) => { e.stopPropagation(); renderAccentPop(); $("#accentPop").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!e.target.closest(".accentWrap")) $("#accentPop").classList.remove("open"); });

/* ================= 应用语言 / 顶栏收起 ================= */
function applyLang() {
	const t = T();
	document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
	$("#thDark").textContent = t.dark;
	$("#thLight").textContent = t.light;
	$("#fontMinus").title = t.fontMinusTitle;
	$("#fontPlus").title = t.fontPlusTitle;
	$("#barCollapse").textContent = t.collapseBar;
	$("#barShow").title = t.expandBar;
	$("#barShowText").textContent = t.expandBar;
	$("#casterIcon").title = t.casterTitle;
	$("#accentBtn").title = t.accentT;
	$("#casterSend").textContent = t.send;
	$("#casterHint").innerHTML = `<b>Tab</b> ${t.hintTab} · <b>⌘/Ctrl+⏎</b> ${t.hintBc} · <b>Esc</b> ${t.hintEsc}`;
	$("#connBanner").textContent = t.connLost;
	$("#langZh").classList.toggle("on", lang === "zh");
	$("#langEn").classList.toggle("on", lang === "en");
	for (const el of paneEls) {
		el.lh3.textContent = t.pickAgent;
		el.cwdInput.placeholder = t.cwdPh;
		el.goBtn.textContent = t.go;
		el.lhint.textContent = t.launcherHint;
		el.reBtn.textContent = t.reBtn;
		el.clearBtn.textContent = t.clearBtn;
		el.maxBtn.title = t.maxT;
		el.restartBtn.title = t.restartT;
		el.closeBtn.title = t.closeT;
		el.ptitle.title = t.clickToEdit;
	}
	for (let i = 0; i < SLOTS; i++) if (!slotPane[i]) renderAgentBtns(i);
	renderCasterTargets();
	updateTitle();
}
$("#langZh").onclick = () => { lang = "zh"; localStorage.setItem("ag:lang", lang); applyLang(); };
$("#langEn").onclick = () => { lang = "en"; localStorage.setItem("ag:lang", lang); applyLang(); };

let barCollapsed = localStorage.getItem("ag:barCollapsed") === "1";
function applyBar() { document.body.classList.toggle("bar-collapsed", barCollapsed); }
$("#barCollapse").onclick = () => { barCollapsed = true; localStorage.setItem("ag:barCollapsed", "1"); applyBar(); };
$("#barShow").onclick = () => { barCollapsed = false; localStorage.setItem("ag:barCollapsed", "0"); applyBar(); };

applyLang();
applyBar();
applyTheme();
applyFontSize();
updateTitle();
</script>
